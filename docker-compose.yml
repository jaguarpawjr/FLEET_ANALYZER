services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      PORT: 3000
      OUTPUT_DIR: /app/data/assessment-processed
      ASSESSMENT_DIR: /app
      INPUT_DIR: /app
      REGISTER_FILE: vehicles_clean.csv
    ports:
      - "3000:3000"
    volumes:
      - analytics-data:/app/data/assessment-processed
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
      args:
        VITE_API_URL: /api
    environment:
      API_ORIGIN: http://api:3000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "4173:4173"
volumes:
  analytics-data:
